# =============================================================================
# Cutler Research Brain - Phase 1
# Source type / document type / strategy theme classification rules
# =============================================================================
#
# HOW THIS FILE IS USED
# ---------------------
# scripts/scan_source_archive.py lowercases the file's relative path
# (folders + file name) and tests each rule in the order listed below.
# The FIRST rule whose keyword appears in the text wins. If no rule matches,
# the value falls back to the extension defaults (if any), otherwise "Unknown".
#
# These are GUESSES, not verified classifications. Every guess is written to a
# *_guess column and anything Unknown is flagged for human review.
# Principle: AI drafts. Humans verify. Cutler decides.
#
# EDITING
# -------
# - Keywords are matched as plain lowercase substrings (no regex).
# - Put the most specific rules FIRST (e.g. Green Street before Sell-Side).
# - Keep keywords distinctive; short generic words cause false positives.
# =============================================================================

# ----------------------------------------------------------------------------
# SOURCE TYPE - where the document came from
# Allowed values: SEC Filing, Company Press Release, Sell-Side Research,
#   Credit Research, Convertible Research, REIT Research, Bank Research,
#   Green Street Research, Market Monitor, Short Sale Research,
#   Industry Research, Template, Unknown
# ----------------------------------------------------------------------------
