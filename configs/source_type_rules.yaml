# ----------------------------------------------------------------------------
# FOLDER PATH RULES (Phase 1.2)
#
# The archive's own folder structure is a stronger signal than any keyword in a
# file name, and it is what cuts the Unknown counts down. A rule fires when the
# named folder appears as a path SEGMENT (case-insensitive).
#
# Precedence used by scan_source_archive.py:
#   1. a strong filing / press-release signal in the FILE NAME
#   2. these folder rules
#   3. the keyword rules higher up this file
#   4. extension defaults, else Unknown
# ----------------------------------------------------------------------------
source_type_folder_rules:
  - folders: ["green street", "greenstreet", "green_street"]
    source_type: Green Street Research
  - folders: ["converts", "convert", "convertibles", "convertible", "exchangeables"]
    source_type: Convertible Research
  - folders: ["reits", "reit", "real estate"]
    source_type: REIT Research
  - folders: ["credit", "credits", "bonds", "fixed income"]
    source_type: Credit Research
  - folders: ["banks", "bank", "community banks", "banking"]
    source_type: Bank Research
  - folders: ["short sale", "short sales", "shorts", "short ideas"]
    source_type: Short Sale Research
  - folders: ["monitors", "monitor", "market monitor"]
    source_type: Market Monitor
  - folders: ["research", "sell side", "sell-side", "street research", "broker research"]
    source_type: Sell-Side Research
    # If the file name looks like sector/industry work rather than a single
    # name, Industry Research is used instead.
    industry_alternate: Industry Research
  - folders: ["industry", "industries", "sectors", "sector"]
    source_type: Industry Research
  - folders: ["companies", "company", "company files", "names"]
    source_type: Company Material
  - folders: ["templates", "template"]
    source_type: Template

# Folder rules for document_type. Same precedence.
document_type_folder_rules:
  - folders: ["companies", "company", "company files", "names"]
    document_type: Company Material
  - folders: ["templates", "template"]
    document_type: Template
  - folders: ["converts", "convertibles", "exchangeables"]
    document_type: Convertible Note
  - folders: ["credit", "bonds", "fixed income"]
    document_type: Credit Note
  - folders: ["research", "monitors", "banks", "reits", "industry", "green street"]
    document_type: Research Note

# Words in the FILE NAME that decide the type on their own, before folder rules.
strong_filename_signals:
  # Checked first: a template is a template whatever else the name says.
  template:
    - "template"
    - "blank form"
    - "checklist"
    - "worksheet"
    - "boilerplate"
  sec_filing:
    - "10-k"
    - "10k"
    - "10-q"
    - "10q"
