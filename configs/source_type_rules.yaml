# ============================================================================
# PHASE 1.1 ADDITIONS
# ============================================================================

# ----------------------------------------------------------------------------
# SECURITY CONTEXT KEYWORDS
# Used for possible_maturity_years. A future year inside a file name that also
# carries one of these words is almost certainly a bond/convert maturity
# ("XYZ 3.25% Convertible Notes due 2029"), not the year the document belongs
# to. Such years are recorded in possible_maturity_years and are BLOCKED from
# becoming detected_year.
# ----------------------------------------------------------------------------
security_context_keywords:
  - "convertible"
  - "convert"
  - "converts"
  - "exchangeable"
  - "note"
  - "notes"
  - "bond"
  - "bonds"
  - "debenture"
  - "due"
  - "maturity"
  - "matures"
  - "coupon"
  - "senior"
  - "subordinated"
  - "sub notes"
  - "sr notes"
  - "preferred"
  - "pfd"
  - "term loan"
  - "revolver"
  - "indenture"
  - "call schedule"
  - "yield"
  - "ytm"
  - "ytw"
  - "cusip"
  - "isin"
  - "%"

# Any file-name year further out than (current year + this many years) is
# treated as a possible maturity year even without a security keyword.
# With the archive currently at 2026, 1 means 2028 and beyond are captured.
maturity_year_lookahead: 1

# Oldest / newest year that may ever be accepted as detected_year.
min_plausible_year: 1990
max_plausible_year_offset: 1     # current year + 1

# ----------------------------------------------------------------------------
# REVIEW SEVERITY MAP (Phase 1.1)
# review_category is a semicolon-separated list of the categories below.
# review_severity is the HIGHEST severity among the categories present.
#
# The point of this change: needs_review was true for ~2/3 of the archive,
# which is not a work queue. Severity turns it into one - work High first,
# then Medium; Low is background cleanup that mostly gets fixed by editing
# the keyword rules in this file rather than by touching files.
# ----------------------------------------------------------------------------
review_severity_map:
  sensitive_data: High          # possible client / portfolio / holdings / account /
                                # performance / allocation reference in the path
  scan_error: High              # metadata or hash could not be read - inventory gap
  duplicate: Medium             # same SHA-256 as another file
  no_ticker_on_research: Medium # research-looking document with no clean ticker
  unknown_source_type: Low      # classification gap, fix by editing rules
  unknown_document_type: Low    # classification gap, fix by editing rules

# Order used when rendering review_category, most severe first.
review_category_order:
  - sensitive_data
  - scan_error
  - duplicate
  - no_ticker_on_research
  - unknown_source_type
  - unknown_document_type

# ============================================================================
# PHASE 1.2 ADDITIONS - metadata QA cleanup
# ============================================================================

# ----------------------------------------------------------------------------
# SENSITIVE DATA, TWO TIERS
#
# Phase 1.1 treated any occurrence of "portfolio", "client", "performance" and
# friends as High severity. In a research archive most of those are ordinary
# public-company language ("Expands Portfolio", "Financial Statements",
# "performance-based equity award"), which buried the genuinely restricted
# material. Phase 1.2 splits the test in two.
#
#   sensitive_strong_phrases  -> sensitive_context_guess = possible_restricted_data
#                                review_severity = High
#   sensitive_weak_keywords   -> depends on context:
#       + a public_language_phrase        -> public_company_language      (Low)
#       + research/business context       -> research_business_language   (Low)
#       + nothing to explain it           -> needs_manual_check           (Medium)
#
# Every row with any hit still appears in sensitive_data_review_report.csv,
# with sensitive_keyword_hits and sensitive_context_guess so a human can judge.
# When in doubt the row stays visible - we downgrade severity, never hide it.
# ----------------------------------------------------------------------------
