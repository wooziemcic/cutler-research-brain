# ----------------------------------------------------------------------------
# REVIEW SEVERITY MAP (Phase 1.2 replaces the Phase 1.1 map above)
# The last definition of a key wins in YAML, so this is the effective map.
# ----------------------------------------------------------------------------
review_severity_map:
  sensitive_data: High               # strong restricted-data phrase in the path
  scan_error: High                   # metadata or hash could not be read
  possible_sensitive_data: Medium    # weak keyword, nothing explains it
  duplicate: Medium                  # same SHA-256 as another file
  no_ticker_on_research: Medium      # research-looking document, no clean ticker
  public_language_sensitive: Low     # weak keyword in ordinary company language
  unknown_source_type: Low           # classification gap, fix by editing rules
  unknown_document_type: Low         # classification gap, fix by editing rules

review_category_order:
  - sensitive_data
  - scan_error
  - possible_sensitive_data
  - duplicate
  - no_ticker_on_research
  - public_language_sensitive
  - unknown_source_type
  - unknown_document_type
