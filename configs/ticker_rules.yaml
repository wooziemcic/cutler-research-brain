# They are NOT deleted, because several are also real listed tickers
# (GS, MS, JPM, DB, UBS, RBC, CS, C, BCS, WFC ...). A token from this list is
# moved to source_vendor_candidates only when it appears in a SOURCE-LIKE
# POSITION - see source_position_rules below. Otherwise it stays in
# ticker_candidates_clean and the row is capped at Medium confidence.
# ----------------------------------------------------------------------------
