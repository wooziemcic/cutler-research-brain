# Lowercase phrases searched in the WHOLE relative path. A hit here means the
# document sits in a research-provider context, which makes any vendor token in
# the file name source-like.
vendor_phrases:
  - "j.p. morgan"
  - "jp morgan"
  - "jpmorgan"
  - "goldman sachs"
  - "morgan stanley"
  - "bank of america"
  - "merrill"
  - "wells fargo"
  - "deutsche bank"
  - "credit suisse"
  - "barclays"
  - "raymond james"
  - "piper sandler"
  - "keefe bruyette"
  - "green street"
  - "greenstreet"
  - "bloomberg intelligence"
  - "s&p global"
  - "seeking alpha"
  - "d.a. davidson"
  - "b. riley"
  - "janney"
  - "hovde"
  - "stifel"
  - "jefferies"
  - "kbw"

# Words that mark the file name as sell-side / provider research. When one of
# these is present, a vendor token in the name is treated as the source.
source_context_keywords:
  - "research"
  - "note"
  - "initiation"
  - "initiating"
  - "coverage"
  - "estimates"
  - "price target"
  - "rating"
  - "analyst"
  - "sell-side"
  - "sellside"
  - "morning"
  - "daily"
  - "weekly"
  - "comment"
  - "flash"
  - "first take"

# A vendor token counts as being in a SOURCE-LIKE POSITION when any of these
# is true. Set any of them to false to loosen the rule.
source_position_rules:
  # The token sits after the last " - " separator, e.g. "HBT Q2 Note - KBW"
  after_dash_separator: true
  # The token is one of the last two tokens of the file name
  in_last_two_tokens: true
  # The path or file name matched vendor_phrases / source_context_keywords
  research_context_in_path: true

# ============================================================================
# PHASE 1.2 ADDITIONS - ticker noise
# ============================================================================

# STRONG VENDOR TOKENS
# These are research sources or media outlets far more often than they are the
# subject of a Cutler file. They go to source_vendor_candidates by default -
# the source-position test is skipped. The single exception is when the token
# is the FIRST token of the file name AND the file name carries company
# context (see strong_vendor_first_token_exception), which is what a genuine
# company-specific file looks like: "WF Q2 2026 earnings.pdf".
strong_vendor_tokens:
  - BI          # Bloomberg Intelligence
  - QT          # Quick Take / data vendor shorthand
  - WF          # Wells Fargo
  - CNN         # news outlet
  - CNBC
  - WSJ
  - BBG
  - SNL
  - GSA
  - IBES

strong_vendor_first_token_exception: true

# File-name words that make a first-token strong vendor look like a genuine
# company file rather than a source attribution.
company_context_keywords:
  - "earnings"
  - "results"
  - "10-k"
  - "10-q"
  - "8-k"
  - "press release"
  - "investor"
  - "dividend"
  - "guidance"
  - "acquisition"
  - "merger"
  - "buyback"
  - "quarterly"
  - "annual"

# TOKENS THAT ARE ALMOST NEVER THE SUBJECT
# Present in raw for auditing, never promoted to a clean ticker candidate.
never_ticker_tokens:
  - CNN
  - CNBC
  - WSJ
  - BARRONS
  - REUTERS
  - BBG

# THEME TOKENS
# A token that is usually a concept, not a company. It is dropped from the
# clean candidates when any of its context words appears in the file name or
# path; without that context it stays a candidate (AI really is a listed
# ticker, so this must not be a blanket exclusion).
theme_tokens:
  AI:
    - "artificial intelligence"
    - "agentic"
    - "ai infrastructure"
    - "ai capabilities"
    - "ai capex"
    - "ai adoption"
    - "ai strategy"
    - "ai data center"
    - "ai spending"
    - "generative"
    - "machine learning"
    - "llm"
    - "gpu"
    - "copilot"
    - "data center"
    - "hyperscaler"
    - "semiconductor"
  EV:
    - "electric vehicle"
    - "ev charging"
    - "ev adoption"
  ESG:
    - "sustainability"
    - "climate"
    - "governance"

# PROTECTED TICKERS
# Never treated as a vendor, a theme word or an exclusion, whatever the file
# name looks like. Add real, frequently-seen Cutler names here.
