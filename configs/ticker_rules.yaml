# =============================================================================
# Cutler Research Brain - Phase 1.1
# Ticker candidate detection rules
# =============================================================================
#
# IMPORTANT
# ---------
# This produces TICKER CANDIDATES ONLY. Nothing here is a verified ticker.
# A human (or a later phase with a real security master) must confirm them.
#
# THREE SEPARATE OUTPUT COLUMNS (Phase 1.1)
#   ticker_candidates_raw     every uppercase token that survived the length
#                             filter - noise included, kept for auditing
#   ticker_candidates_clean   raw minus exclusions minus vendor tokens that sat
#                             in a source-like position. This is the column to
#                             review. `ticker_candidates` mirrors it for
#                             backward compatibility.
#   source_vendor_candidates  research providers / broker-dealers (JPM, GS, UBS,
#                             RBC, KBW ...) detected in a source-like position.
#                             NOT company tickers by default - though several of
#                             them are also real listed tickers, which is exactly
#                             why they get their own column instead of deletion.
#
# ticker_confidence is derived, not configured:
#   High    a clean token appears in the first two tokens of the file name and
#           is not itself a vendor token
#   Medium  a clean token exists, but it is late in the name or vendor-ambiguous
#   Low     only vendor-like / ambiguous tokens were found
#   None    nothing usable
#
# HOW DETECTION WORKS (see scripts/scan_source_archive.py)
#   1. Take the file name without its extension (the "stem").
#   2. Strip filing shorthand after digits so 8-K / 10-Q do not leak K and Q.
#   3. Split into tokens on any non-letter character.
#   4. Keep a token only if it is entirely UPPERCASE A-Z and its length is
#      between min_length and max_length  -> ticker_candidates_raw
#   5. Drop exclusions, split off vendor tokens  -> ticker_candidates_clean
#      and source_vendor_candidates
#   6. Skip ALL-CAPS file names entirely (see skip_all_caps_names).
# =============================================================================

min_length: 1
max_length: 5

# Cap on how many candidates we will record for one file. Being conservative
# matters more than being complete: a wrong ticker is worse than a blank.
max_candidates_per_file: 5

# Cap on the audit column ticker_candidates_raw (noise included).
max_raw_candidates_per_file: 10

# If the file stem is essentially written in ALL CAPS (this many or more
# uppercase alphabetic tokens and no lowercase tokens), skip ticker detection
# for that file entirely. Example: "COMMUNITY BANK QUARTERLY UPDATE FINAL".
skip_all_caps_names: true
all_caps_token_threshold: 4

# Also scan the immediate parent folder name for ticker-like tokens.
# Off by default in Phase 1 to stay conservative.
scan_parent_folder: false

# ----------------------------------------------------------------------------
# EXCLUSIONS - known false positives.
# Matched case-insensitively against the uppercase token.
# ----------------------------------------------------------------------------
